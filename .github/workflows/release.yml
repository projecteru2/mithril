name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to build and release
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: Linux_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: Linux_arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: Darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract VERSION
        run: echo "VERSION=$(git describe --tags --always)" >> $GITHUB_ENV

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build
        run: |
          export MITHRIL_VERSION=${{ env.VERSION }}
          export MITHRIL_REVISION=${GITHUB_SHA::12}
          cargo build --release --target ${{ matrix.target }}
          ./target/${{ matrix.target }}/release/mithril --version || true

      - name: Package
        run: |
          V=${VERSION#v}
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf /tmp/bin.tar.gz mithril
          mkdir -p pkg && tar -C pkg -xzf /tmp/bin.tar.gz
          cp LICENSE README.md mithril.conf.sample pkg/
          tar -C pkg -czf dist/mithril_${V}_${{ matrix.artifact }}.tar.gz .
          cp dist/mithril_${V}_${{ matrix.artifact }}.tar.gz dist/mithril_${{ matrix.artifact }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt

      # GitHub's --generate-notes only lists merged PRs; this history is
      # direct commits, so the changelog is built from git log instead.
      - name: Release notes
        run: |
          TAG=$(git describe --tags --abbrev=0)
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          git log --no-merges --pretty='- %h %s' ${PREV:+$PREV..}$TAG \
            | grep -vE '^- [0-9a-f]+ (docs|test|review|ci)[:(]' > /tmp/commits || true
          section() {
            grep -E "^- [0-9a-f]+ $2" /tmp/commits > /tmp/sec || return 0
            printf '### %s\n' "$1" >> /tmp/notes.md
            cat /tmp/sec >> /tmp/notes.md
            printf '\n' >> /tmp/notes.md
          }
          printf '## Changelog\n\n' > /tmp/notes.md
          section Features 'feat[:(]'
          section Performance 'perf[:(]'
          section 'Bug fixes' 'fix[:(]'
          grep -vE '^- [0-9a-f]+ (feat|perf|fix)[:(]' /tmp/commits > /tmp/sec || true
          if [ -s /tmp/sec ]; then printf '### Other\n' >> /tmp/notes.md; cat /tmp/sec >> /tmp/notes.md; printf '\n' >> /tmp/notes.md; fi
          if [ -n "$PREV" ]; then
            printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$PREV" "$TAG" >> /tmp/notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git describe --tags --abbrev=0)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/notes.md dist/* || {
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/notes.md
            gh release upload "$TAG" dist/* --clobber
          }
